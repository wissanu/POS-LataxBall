<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 160 120" role="img" aria-label="ก้อนถ้วยยาง">
  <defs>
    <!-- side of the lump: lit from the upper left -->
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dcc79f"/>
      <stop offset=".45" stop-color="#c3a577"/>
      <stop offset="1" stop-color="#7d5f38"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#2e1f0e" stop-opacity=".38"/>
    </linearGradient>
    <radialGradient id="top" cx="40%" cy="40%" r="75%">
      <stop offset="0" stop-color="#f7f0e0"/>
      <stop offset=".7" stop-color="#e6d8b9"/>
      <stop offset="1" stop-color="#cdb88f"/>
    </radialGradient>

    <!-- one cup lump: wide flat top, tapering down like the cup it set in -->
    <g id="lump">
      <path d="M34 40C33 62 40 84 49 94c6 9 16 12 31 12s25-3 31-12c9-10 16-32 15-54Z" fill="url(#side)"/>
      <path d="M34 40C33 62 40 84 49 94c6 9 16 12 31 12s25-3 31-12c9-10 16-32 15-54Z" fill="url(#fade)"/>
      <!-- creases from the cup mould -->
      <g fill="none" stroke="#5a4020" stroke-opacity=".22" stroke-width="2" stroke-linecap="round">
        <path d="M46 52c2 14 5 26 10 38"/>
        <path d="M63 54c1 17 3 31 6 46"/>
        <path d="M84 55c0 16 0 30-1 47"/>
        <path d="M103 53c-1 15-4 29-9 42"/>
        <path d="M118 50c-1 11-4 21-8 30"/>
      </g>
      <!-- flat rough top -->
      <ellipse cx="80" cy="40" rx="47" ry="15" fill="url(#top)"/>
      <ellipse cx="80" cy="40" rx="47" ry="15" fill="none" stroke="#a88a58" stroke-opacity=".55" stroke-width="1.5"/>
      <g fill="#a98b5a" fill-opacity=".3">
        <ellipse cx="62" cy="38" rx="9" ry="3.4" transform="rotate(-8 62 38)"/>
        <ellipse cx="96" cy="43" rx="11" ry="3.8" transform="rotate(6 96 43)"/>
        <ellipse cx="80" cy="34" rx="6" ry="2.2"/>
        <ellipse cx="108" cy="36" rx="5" ry="2" transform="rotate(-12 108 36)"/>
      </g>
      <g fill="#fff" fill-opacity=".5">
        <ellipse cx="54" cy="35" rx="7" ry="2.2" transform="rotate(-14 54 35)"/>
        <ellipse cx="88" cy="46" rx="5" ry="1.6"/>
      </g>
      <g fill="#6b4f2c" fill-opacity=".4">
        <circle cx="71" cy="45" r="1.1"/><circle cx="101" cy="37" r="1.3"/><circle cx="58" cy="43" r="1"/>
        <circle cx="115" cy="43" r="1"/><circle cx="84" cy="40" r="1.2"/>
      </g>
    </g>
  </defs>

  <ellipse cx="82" cy="108" rx="64" ry="7" fill="#0f172a" opacity=".13"/>

  <!-- smaller lump behind -->
  <use xlink:href="#lump" href="#lump" transform="translate(70 22) scale(.62)" opacity=".92"/>
  <!-- main lump -->
  <use xlink:href="#lump" href="#lump" transform="translate(-18 -4) scale(.92)"/>
</svg>
